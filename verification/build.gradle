plugins {
    id 'io.github.brody-0125.spring-test-isolation'
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
}
tasks.withType(Test).configureEach { testLogging { exceptionFormat = 'full' } }
apply from: 'dependencies.gradle'
def jdbcBackendName = findProperty('jdbcBackend') ?: 'postgresql'
def jdbcBackendProperty = providers.gradleProperty('jdbcBackend').orElse('postgresql')
isolatedTests {
    workers = providers.gradleProperty('workers').map { it.toInteger() }.orElse(2)
    jdbcBackend = jdbcBackendName
    if (jdbcBackendName == 'mysql') {
        mysqlImage = rootProject.containerImages.mysql
    } else if (jdbcBackendName == 'oracle') {
        oracleImage = rootProject.containerImages.oracle
    } else {
        postgresImage = rootProject.containerImages.postgres
    }
    redisImage = rootProject.containerImages.redis
    redisLogicalDatabases = rootProject.cacheInfrastructure.redisLogicalDatabases.toInteger()
    maxCacheSlots = rootProject.cacheInfrastructure.maxWorkerSlots.toInteger()
}
tasks.withType(Test).configureEach {
    systemProperty 'jdbc.backend', jdbcBackendProperty
}
test {
    useJUnitPlatform {
        excludeTags 'negative', 'guard'
        includeEngines 'junit-jupiter'
    }
    systemProperty 'fixture.classpath', sourceSets.test.runtimeClasspath.asPath
    maxHeapSize = '384m'
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
}

tasks.register('workflowTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/workflow/Workflow*Test.class'
    systemProperty 'fixture.workflowPeers', providers.gradleProperty('workers').getOrElse('2')
    maxHeapSize = '384m'
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}
