plugins {
    id 'com.vanniktech.maven.publish'
}
apply from: rootProject.file('gradle/publish-pom.gradle')

base { archivesName = 'spring-test-isolation-runtime' }

java { withSourcesJar() }

def signingConfigured = project.hasProperty('signing.keyId')
        || project.hasProperty('signingInMemoryKey')
        || project.hasProperty('signing.secretKeyRingFile')

mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)
    if (signingConfigured) {
        signAllPublications()
    }
    coordinates(project.group.toString(), 'spring-test-isolation-runtime', project.version.toString())
    pom {
        name = 'spring-test-isolation-runtime'
        springTestIsolationPom(delegate)
    }
}

dependencies {
    api project(':descriptor')
    implementation "org.testcontainers:testcontainers-jdbc:${versions.testcontainers}"
    api "org.springframework:spring-test:${versions.springFramework}"
    api "org.springframework:spring-context:${versions.springFramework}"
    implementation "org.springframework:spring-jdbc:${versions.springFramework}"
    implementation "org.springframework.data:spring-data-redis:${versions.springDataRedis}"
    api "com.github.seregamorph:spring-test-smart-context:${versions.smartContext}"
    implementation "org.postgresql:postgresql:${versions.postgresqlJdbc}"
    api "redis.clients:jedis:${versions.jedis}"
    implementation "org.junit.platform:junit-platform-launcher:${versions.junitPlatform}"
    implementation "org.junit.jupiter:junit-jupiter-api:${versions.junitJupiter}"
    compileOnly "org.testng:testng:${versions.testng}"
    testImplementation "org.junit.jupiter:junit-jupiter:${versions.junitJupiter}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${versions.junitPlatform}"
}
