// Single version matrix for VERIFICATION.md, runtime, plugin SPI, and verification fixtures.
// Bump here when re-verifying a new stack; keep container image tags aligned with evidence logs.
ext.versions = [
        springBoot       : '3.5.1',
        springFramework  : '6.2.8',
        springDataRedis  : '3.5.1',
        testcontainers   : '2.0.5',
        junitJupiter     : '5.12.2',
        junitPlatform    : '1.12.2',
        postgresqlJdbc   : '42.7.7',
        mysqlJdbc        : '9.1.0',
        jedis            : '5.2.0',
        flyway           : '10.22.0',
        smartContext     : '1.0',
]

ext.containerImages = [
        postgres : 'postgres:16.9-alpine',
        mysql    : 'mysql:8.4.5',
        redis    : 'redis:7.4.4-alpine',
]

ext.cacheInfrastructure = [
        redisLogicalDatabases : '256',
        maxWorkerSlots        : '255',
]
