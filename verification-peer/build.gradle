plugins { id 'io.github.brody-0125.spring-test-isolation' }
apply from: '../verification/dependencies.gradle'
sourceSets.test.java.srcDir '../verification/src/test/java'
sourceSets.test.resources.srcDir '../verification/src/test/resources'
isolatedTests { workers = 2 }
io.github.brody0125.springtestisolation.gradle.ConsumerInfrastructure.install(project)
test {
    useJUnitPlatform { excludeTags 'negative', 'guard' }
    systemProperty 'fixture.classpath', sourceSets.test.runtimeClasspath.asPath
    maxHeapSize = '384m'
    testLogging { events 'passed', 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
}
