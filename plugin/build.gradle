plugins {
    id 'java-gradle-plugin'
    id 'com.vanniktech.maven.publish'
}

def rootGradleProps = new Properties()
file("${rootDir}/../gradle.properties").withInputStream { rootGradleProps.load(it) }
group = rootGradleProps.getProperty('group', 'io.github.brody-0125')
version = rootGradleProps.getProperty('version', '1.0.0')

apply from: file("${rootDir}/../gradle/dependency-versions.gradle")
apply from: file("${rootDir}/../gradle/publish-pom.gradle")

repositories { mavenCentral() }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

def infrastructureVersionsDir = layout.buildDirectory.dir('generated/sources/infrastructureVersions')
tasks.register('generateInfrastructureVersions') {
    def outFile = infrastructureVersionsDir.map {
        it.file('io/github/brody0125/springtestisolation/gradle/infrastructure/InfrastructureVersions.java')
    }
    outputs.file(outFile)
    doLast {
        def file = outFile.get().asFile
        file.parentFile.mkdirs()
        file.text = """package io.github.brody0125.springtestisolation.gradle.infrastructure;

/** Generated from gradle/dependency-versions.gradle — do not edit. */
public final class InfrastructureVersions {
    private InfrastructureVersions() {}
    public static final String POSTGRES_IMAGE = "${containerImages.postgres}";
    public static final String MYSQL_IMAGE = "${containerImages.mysql}";
    public static final String ORACLE_IMAGE = "${containerImages.oracle}";
    public static final String REDIS_IMAGE = "${containerImages.redis}";
    public static final String REDIS_LOGICAL_DATABASES = "${cacheInfrastructure.redisLogicalDatabases}";
    public static final String MAX_WORKER_SLOTS = "${cacheInfrastructure.maxWorkerSlots}";
}
"""
    }
}
sourceSets.main.java.srcDir infrastructureVersionsDir
tasks.named('compileJava') { dependsOn 'generateInfrastructureVersions' }
tasks.named('sourcesJar') { dependsOn 'generateInfrastructureVersions' }

dependencies {
    implementation platform("org.testcontainers:testcontainers-bom:${versions.testcontainers}")
    implementation 'org.testcontainers:testcontainers'
    implementation 'org.testcontainers:testcontainers-postgresql'
    implementation 'org.testcontainers:testcontainers-mysql'
    implementation 'org.testcontainers:testcontainers-oracle-xe'
    implementation "com.mysql:mysql-connector-j:${versions.mysqlJdbc}"
    implementation "com.oracle.database.jdbc:ojdbc11:${versions.oracleJdbc}"
    testImplementation "org.junit.jupiter:junit-jupiter:${versions.junitJupiter}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${versions.junitPlatform}"
}
test { useJUnitPlatform() }

gradlePlugin {
    website = 'https://github.com/brody-0125/spring-test-isolation'
    vcsUrl = 'https://github.com/brody-0125/spring-test-isolation'
    plugins {
        isolatedTests {
            id = 'io.github.brody-0125.spring-test-isolation'
            implementationClass = 'io.github.brody0125.springtestisolation.gradle.IsolatedTestsPlugin'
            displayName = 'Spring Test Isolation'
            description = 'Run Spring tests across Gradle workers with isolated worker storage, attaching to consumer JDBC and optional Redis.'
        }
    }
}

ext.publishArtifactTitle = 'spring-test-isolation-gradle-plugin'
def signingConfigured = project.hasProperty('signing.keyId')
        || project.hasProperty('signingInMemoryKey')
        || project.hasProperty('signing.secretKeyRingFile')

mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)
    if (signingConfigured) {
        signAllPublications()
    }
    coordinates(project.group.toString(), 'spring-test-isolation-gradle-plugin', project.version.toString())
    pom {
        name = 'spring-test-isolation-gradle-plugin'
        springTestIsolationPom(delegate)
    }
}
