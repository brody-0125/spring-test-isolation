name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Runtime and plugin unit tests
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          rm -rf "$HOME/.m2/repository/io/github/brody-0125/spring-test-isolation-descriptor/$VERSION"
          rm -rf "$HOME/.m2/repository/io/github/brody-0125/spring-test-isolation-runtime/$VERSION"
          rm -rf "$GRADLE_USER_HOME/caches/modules-2/files-2.1/io.github.brody-0125/spring-test-isolation-descriptor"
          rm -rf "$GRADLE_USER_HOME/caches/modules-2/files-2.1/io.github.brody-0125/spring-test-isolation-runtime"
          ./gradlew :descriptor:clean :descriptor:publishToMavenLocal :runtime:clean :runtime:publishToMavenLocal --rerun-tasks
          ./gradlew :descriptor:test :runtime:test :maven-plugin:test :plugin:test :plugin:validatePlugins --refresh-dependencies

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Docker integration (verify.sh)
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/verify.sh -Workers 2

  config-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configuration cache (verify-config-cache.sh)
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/verify-config-cache.sh -Workers 2
