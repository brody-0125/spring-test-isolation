name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Runtime and plugin unit tests
        run: |
          ./gradlew :runtime:publishToMavenLocal :runtime:test :maven-plugin:test :plugin:test :plugin:validatePlugins

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Docker integration (verify.sh)
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/verify.sh -Workers 2

  config-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configuration cache (verify-config-cache.sh)
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/verify-config-cache.sh -Workers 2
